<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="100%" height="100%" style="background-color: #ededed; font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Card Drop Shadow -->
    <filter id="cardShadow" x="-3%" y="-2%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#d81b60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g id="header" transform="translate(0, 36)">
    <text x="720" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#202124" letter-spacing="-0.5">Live API: Function Calling &amp; State Tracking Comparison</text>
    <text x="720" y="22" text-anchor="middle" font-size="13" font-weight="400" fill="#5f6368">Synchronous Blocking Tools vs. Extended Thinking with Non-Blocking Tools &amp; Background Reasoning</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT CARD: STANDARD LIVE MODEL (SYNCHRONOUS / BLOCKING)                   -->
  <!-- ========================================================================= -->
  <g id="card-standard-live" transform="translate(40, 75)">
    <rect width="610" height="665" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header Section -->
    <g transform="translate(32, 28)">
      <rect width="180" height="24" rx="12" fill="#e8f0fe"/>
      <text x="90" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a73e8" letter-spacing="0.3">STANDARD LIVE MODEL</text>
      <text x="0" y="48" font-size="18" font-weight="700" fill="#202124">gemini-3.5-live-preview</text>
    </g>

    <!-- Lifelines -->
    <line x1="130" y1="185" x2="130" y2="600" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="480" y1="185" x2="480" y2="600" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- Entity: Client -->
    <g transform="translate(130, 130)">
      <circle cx="0" cy="0" r="34" fill="#e6f4ea"/>
      <rect x="-13" y="-10" width="26" height="16" rx="2" fill="none" stroke="#137333" stroke-width="2.2"/>
      <line x1="-16" y1="10" x2="16" y2="10" stroke="#137333" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Client</text>
    </g>

    <!-- Entity: Live API -->
    <g transform="translate(480, 130)">
      <circle cx="0" cy="0" r="34" fill="#fce4ec"/>
      <circle cx="0" cy="0" r="3.5" fill="#d81b60"/>
      <path d="M -6 -6 A 9 9 0 0 0 -6 6" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 6 -6 A 9 9 0 0 1 6 6" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -12 -12 A 17 17 0 0 0 -12 12" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 12 -12 A 17 17 0 0 1 12 12" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Live API</text>
    </g>

    <!-- Sequence Steps -->
    <!-- 1. User Audio Input -->
    <g transform="translate(0, 215)">
      <path d="M 130 0 L 472 0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrowGray)"/>
      <text x="305" y="-10" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">1. User Audio Stream</text>
    </g>

    <!-- 2. Synchronous Tool Call -->
    <g transform="translate(0, 280)">
      <path d="M 480 0 L 138 0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
      <text x="305" y="-12" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">2. toolCall: searchFlights(...)</text>
      <g transform="translate(205, 6)">
        <rect x="0" y="0" width="200" height="20" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="100" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Synchronous (Blocks speech)</text>
      </g>
    </g>

    <!-- 3. Tool Response -->
    <g transform="translate(0, 360)">
      <path d="M 130 0 L 472 0" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
      <text x="305" y="-10" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">3. toolResponse: { flight: "DL 145" }</text>
    </g>

    <!-- 4. Model Audio Response Stream -->
    <g transform="translate(0, 435)">
      <path d="M 480 0 L 138 0" stroke="#d81b60" stroke-width="1.8" marker-end="url(#arrowPink)"/>
      <text x="305" y="-12" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">4. Model Audio Response</text>
    </g>

    <!-- 5. Turn Complete Signal -->
    <g transform="translate(0, 510)">
      <path d="M 480 0 L 138 0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrowGray)"/>
      <g transform="translate(235, -13)">
        <rect x="0" y="0" width="140" height="24" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="70" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">turnComplete: true</text>
      </g>
    </g>

    <!-- Bottom Status Pill -->
    <g transform="translate(305, 575)">
      <rect x="-185" y="-15" width="370" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-size="11.5" font-weight="500" fill="#475569">Client UI: <tspan font-weight="700" fill="#991b1b">Silent Tool Wait</tspan> ➔ <tspan font-weight="700" fill="#1e293b">Speaking ➔ Idle</tspan></text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT CARD: EXTENDED THINKING (ASYNC / BACKGROUND REASONING)              -->
  <!-- ========================================================================= -->
  <g id="card-extended-thinking" transform="translate(680, 75)">
    <rect width="720" height="665" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header Section -->
    <g transform="translate(32, 28)">
      <rect width="195" height="24" rx="12" fill="#fef3c7"/>
      <text x="97" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" letter-spacing="0.3">EXTENDED THINKING</text>
      <text x="0" y="48" font-size="18" font-weight="700" fill="#202124">gemini-3.5-live-extended-thinking-preview</text>
    </g>

    <!-- Lifelines -->
    <line x1="130" y1="185" x2="130" y2="600" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="550" y1="185" x2="550" y2="600" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- Background Reasoning Execution Bar on Live API Lifeline -->
    <rect x="536" y="215" width="28" height="305" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <g transform="translate(572, 345)">
      <rect x="0" y="-14" width="132" height="48" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <path d="M 12 10 C 12 4.5 16.5 0 22 0 C 16.5 0 12 -4.5 12 -10 C 12 -4.5 7.5 0 2 0 C 7.5 0 12 4.5 12 10 Z" fill="#d97706" transform="translate(6, 0) scale(0.7)"/>
      <text x="26" y="2" font-size="10.5" font-weight="700" fill="#92400e">Background</text>
      <text x="26" y="15" font-size="10.5" font-weight="700" fill="#92400e">Reasoning &amp; Tools</text>
    </g>

    <!-- Entity: Client -->
    <g transform="translate(130, 130)">
      <circle cx="0" cy="0" r="34" fill="#e6f4ea"/>
      <rect x="-13" y="-10" width="26" height="16" rx="2" fill="none" stroke="#137333" stroke-width="2.2"/>
      <line x1="-16" y1="10" x2="16" y2="10" stroke="#137333" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Client</text>
    </g>

    <!-- Entity: Live API -->
    <g transform="translate(550, 130)">
      <circle cx="0" cy="0" r="34" fill="#fce4ec"/>
      <circle cx="0" cy="0" r="3.5" fill="#d81b60"/>
      <path d="M -6 -6 A 9 9 0 0 0 -6 6" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 6 -6 A 9 9 0 0 1 6 6" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -12 -12 A 17 17 0 0 0 -12 12" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 12 -12 A 17 17 0 0 1 12 12" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Live API</text>
    </g>

    <!-- Sequence Steps -->
    <!-- 1. User Audio Input -->
    <g transform="translate(0, 215)">
      <path d="M 130 0 L 528 0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrowGray)"/>
      <text x="330" y="-10" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">1. User Audio Stream</text>
    </g>

    <!-- 2. Early Spoken Filler + Dual Status Tracking -->
    <g transform="translate(0, 280)">
      <path d="M 536 0 L 138 0" stroke="#d81b60" stroke-width="1.8" marker-end="url(#arrowPink)"/>
      <text x="330" y="-12" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">2. Spoken Filler ("Checking flights...")</text>
      
      <!-- Dual Badges -->
      <g transform="translate(195, 6)">
        <rect x="0" y="0" width="124" height="20" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="62" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">turnComplete: true</text>
      </g>
      <g transform="translate(325, 6)">
        <rect x="0" y="0" width="168" height="20" rx="5" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="84" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">status: "IN_PROGRESS"</text>
      </g>
    </g>

    <!-- 3. Asynchronous Tool Call -->
    <g transform="translate(0, 360)">
      <path d="M 536 0 L 138 0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
      <text x="330" y="-12" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">3. toolCall: searchFlights(...)</text>
      <g transform="translate(235, 6)">
        <rect x="0" y="0" width="190" height="20" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
        <text x="95" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">status: "REQUIRES_ACTION"</text>
      </g>
    </g>

    <!-- 4. Tool Response -->
    <g transform="translate(0, 435)">
      <path d="M 130 0 L 528 0" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
      <text x="330" y="-10" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">4. toolResponse: { flight: "DL 145" }</text>
    </g>

    <!-- 5. Final Spoken Answer + Dual Status Tracking -->
    <g transform="translate(0, 510)">
      <path d="M 536 0 L 138 0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
      <text x="330" y="-12" text-anchor="middle" font-size="11.5" font-weight="600" fill="#202124">5. Final Spoken Response</text>
      
      <!-- Dual Badges -->
      <g transform="translate(210, 6)">
        <rect x="0" y="0" width="124" height="20" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="62" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">turnComplete: true</text>
      </g>
      <g transform="translate(340, 6)">
        <rect x="0" y="0" width="120" height="20" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">status: "IDLE"</text>
      </g>
    </g>

    <!-- Bottom Status Pill -->
    <g transform="translate(345, 575)">
      <rect x="-240" y="-15" width="480" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-size="11.5" font-weight="500" fill="#475569">Client UI: <tspan font-weight="700" fill="#b45309">Thinking / Filler</tspan> ➔ <tspan font-weight="700" fill="#5b21b6">Tool Exec</tspan> ➔ <tspan font-weight="700" fill="#15803d">Final Answer ➔ Idle</tspan></text>
    </g>
  </g>

</svg>